<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidnightFlix | Smart Movie Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <nav class="top-nav">
        <div class="logo">MidnightFlix</div>
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
            <span class="material-symbols-outlined">settings</span>
        </button>
    </nav>

    <aside id="settings-panel" class="settings-drawer">
        <div class="drawer-header">
            <h2>Settings</h2>
            <button id="close-settings" class="icon-btn"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="drawer-content">
            <div class="setting-item">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </aside>
    <div id="drawer-overlay" class="overlay"></div>

    <main class="container">
        <div class="search-filter-bar">
            <div class="search-box">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="search-input" placeholder="Search movies...">
            </div>
            <div class="filters">
                <select id="genre-filter"><option value="">All Genres</option></select>
                <select id="year-filter"><option value="">Year</option></select>
                <select id="rating-filter">
                  <option value="">Rating</option>
                  <option value="5">5+</option>
                  <option value="6">6+</option>
                  <option value="7">7+</option>
                  <option value="8">8+</option>
                  <option value="9">9+</option>
                </select>
                <select id="lang-filter">
                  <option value="">Language</option>
                  <option value="en-US">English</option>
                  <option value="hi-IN">Hindi</option>
                </select>
            </div>
        </div>

        <div id="movie-grid" class="movie-grid">
            <!-- Movie cards injected here -->
        </div>

        <div class="pagination">
            <button id="prev-btn" class="btn hidden">Previous</button>
            <button id="next-btn" class="btn hidden">Next</button>
        </div>
    </main>

    <!-- Modals -->
    <div id="details-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal"><span class="material-symbols-outlined">close</span></button>
            <div id="details-body" class="details-body"></div>
        </div>
    </div>

    <div id="trailer-modal" class="modal-overlay">
        <div class="trailer-content">
            <button class="close-modal"><span class="material-symbols-outlined">close</span></button>
            <div id="trailer-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
